
services:
  manager:
    build:
      context: ./manager
    container_name: charon-manager
    restart: unless-stopped
    ports:
      - "8080:8080" # Channels DVR connects here to fetch M3U and Streams
    volumes:
      # Required to allow Go Docker SDK to spawn Tuner containers natively
      - /var/run/docker.sock:/var/run/docker.sock 
    environment:
      - MAX_TUNERS=3
      - TUNER_IMAGE="charon-tuner:latest"
      - NETWORK_NAME="charon-net"
      - PROVIDER="yttv"
    networks:
      - charon-net

  # This service exists only to build the image. 
  # The Go Manager will spawn instances of this image programmatically.
  tuner-base:
    build:
      context: ./tuner
    image: charon-tuner:latest
    profiles: 
      - donotstart
    # The manager will mount these dynamically when creating the container,
    # but they are documented here for the build context.
    devices:
      - /dev/dri:/dev/dri # Hardware acceleration (VAAPI/QuickSync)
    shm_size: '2gb' # Wayland/Playwright requires adequate shared memory

networks:
  charon-net:
    name: charon-net